services:
  db:
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: anchorpoint
      POSTGRES_USER: anchorpoint
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchorpoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://anchorpoint:localdev@db:5432/anchorpoint
      VECTORSTORE_PROVIDER: pgvector
      S3_BUCKET_NAME: ""
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["python", "-m", "src.workers.ingestion_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://anchorpoint:localdev@db:5432/anchorpoint
      VECTORSTORE_PROVIDER: pgvector
      S3_BUCKET_NAME: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
