[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-knowledge"
version = "0.1.0"
description = "Industrial vertical knowledge RAG application for equipment service companies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FinTek" }]
dependencies = [
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "python-docx>=1.0",
    "pymupdf>=1.23",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
