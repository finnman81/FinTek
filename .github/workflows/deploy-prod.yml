name: Deploy Prod

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: industrial-api
  SHARED_SERVICES_ACCOUNT: "555555555555"
  PROD_ACCOUNT: "777777777777"

jobs:
  approve-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC) - deploy prod
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555555555555:role/github-actions-industrial-deploy-prod
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote image to prod App Runner
        run: |
          IMAGE_URI="${SHARED_SERVICES_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${{ steps.tag.outputs.version }}"
          aws apprunner update-service \
            --service-arn "arn:aws:apprunner:${AWS_REGION}:${PROD_ACCOUNT}:service/industrial-prod-api" \
            --source-configuration "{\"ImageRepository\":{\"ImageIdentifier\":\"${IMAGE_URI}\",\"ImageRepositoryType\":\"ECR\"}}"

      - name: Wait for deployment
        run: |
          aws apprunner wait service-running \
            --service-arn "arn:aws:apprunner:${AWS_REGION}:${PROD_ACCOUNT}:service/industrial-prod-api" \
            || true
