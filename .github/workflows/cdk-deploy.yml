name: CDK Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/cdk/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK dependencies
        run: pip install -r infrastructure/cdk/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555555555555:role/github-actions-industrial-build
          aws-region: us-east-1

      - name: CDK synth
        working-directory: infrastructure/cdk
        run: npx cdk synth --quiet

  deploy-dev:
    needs: synth
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK dependencies
        run: pip install -r infrastructure/cdk/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555555555555:role/github-actions-industrial-deploy-dev
          aws-region: us-east-1

      - name: CDK deploy dev stacks
        working-directory: infrastructure/cdk
        run: npx cdk deploy --all --require-approval never -c env=dev

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK dependencies
        run: pip install -r infrastructure/cdk/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555555555555:role/github-actions-industrial-deploy-prod
          aws-region: us-east-1

      - name: CDK deploy prod stacks
        working-directory: infrastructure/cdk
        run: npx cdk deploy --all --require-approval never -c env=prod
